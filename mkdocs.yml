site_name: MusicPre · 音乐展示
site_description: 音乐展示与记录
site_url: https://musicpre.xuebasy.top/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - content.code.copy

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 总览:
    - 首页: index.md
  - 动漫:
    - 总览: categories/动漫.md
    - "Mygo&Mujica":
      - ♪ g.me.g.you-前半段: recordings/55d6d6317275.md
      - ♪ 春日影-前半段: recordings/efc00816ef3a.md
    - 葬送的芙莉莲:
      - ♪ zoltraak-分饰二声部: recordings/7c1c491f4bbd.md
  - 原神:
    - 总览: categories/原神.md
    - 挪德卡莱:
      - 霜月:
        - ♪ 须臾的舒闲: recordings/311a8a5a417a.md
      - ♪ 如生之不竭: recordings/5df0fe129a92.md
    - 璃月:
      - 沉玉谷:
        - ♪ 竹林溪涧: recordings/502cc9468b88.md
      - ♪ 北国的宝库: recordings/ef0d505a6abe.md
      - ♪ 品茗尝清心: recordings/b7202649f219.md
      - ♪ 杯中明月: recordings/d1414380c8a0.md
    - 纳塔:
      - 果园:
        - ♪ 勤倦之畛: recordings/85779cf81cec.md
    - 蒙德:
      - 龙脊雪山:
        - ♪ 银白的希望: recordings/fa32a3b5837c.md
    - 足迹:
      - ♪ 命定的别离: recordings/078ecda5e52b.md
    - 魔女会:
      - ♪ 风轻云暖: recordings/721d7ebabaca.md
