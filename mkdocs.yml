site_name: MusicPre · 音乐展示
site_description: 音乐展示与记录
site_url: https://musicpre.xuebasy.top/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - content.code.copy

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 总览:
    - 首页: index.md
  - 动漫:
    - 总览: categories/动漫.md
    - "Mygo&Mujica":
      - ♪ g.me.g.you-前半段: recordings/55d6d6317275.md
      - ♪ 春日影-前半段: recordings/efc00816ef3a.md
  - 原神:
    - 总览: categories/原神.md
    - 挪德卡莱:
      - 霜月:
        - ♪ 须臾的舒闲: recordings/311a8a5a417a.md
    - 纳塔:
      - 果园:
        - ♪ 勤倦之畛: recordings/85779cf81cec.md
    - 魔女会:
      - ♪ 风轻云暖: recordings/721d7ebabaca.md
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/track-player.js

extra:
  social: []
